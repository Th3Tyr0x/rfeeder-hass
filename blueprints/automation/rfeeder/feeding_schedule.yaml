blueprint:
  name: RFeeder Feeding Schedule
  description: >-
    Feeding schedule for the Robotail RFeeder. Runs rfeeder.feed_now at the
    chosen time on the chosen weekdays. Create one automation per feeding
    plan. (These plans run through Home Assistant — for plans that keep
    working even when HA is down, use the rfeeder.add_schedule service to
    store the plan on the device itself.)
  domain: automation
  source_url: https://github.com/Th3Tyr0x/rfeeder-hass/blob/main/blueprints/automation/rfeeder/feeding_schedule.yaml
  input:
    feed_time:
      name: Feeding time
      description: Local time of day
      selector:
        time: {}
    weekdays:
      name: Weekdays
      description: Days on which to feed (none selected = every day)
      default: []
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    compartment:
      name: Tray compartment
      description: Tray compartment to feed from (1-4)
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    duration_minutes:
      name: Lid opening duration
      description: How long the lid stays open, in minutes
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
          mode: box
    preheat:
      name: Pre-heat
      description: Warm the food before feeding
      default: false
      selector:
        boolean: {}

variables:
  weekdays: !input weekdays

trigger:
  - platform: time
    at: !input feed_time

condition:
  - condition: template
    value_template: >-
      {{ weekdays | length == 0 or
         ['sun','mon','tue','wed','thu','fri','sat'][now().isoweekday() % 7] in weekdays }}

action:
  - action: rfeeder.feed_now
    data:
      tray_compartment_index: !input compartment
      feed_duration_minutes: !input duration_minutes
      heat_before_feeding: !input preheat

mode: single

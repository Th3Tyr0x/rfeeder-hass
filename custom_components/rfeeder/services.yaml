  fields:
    device_id:
      required: false
      selector:
        text:
    plan:
      required: true
      selector:
        object:
    replace:
      required: false
      default: true
      selector:
        boolean:

remove_schedule:
  fields:
    device_id:
      required: false
      selector:
        text:
    schedule_id:
      required: true
      selector:
        number:

    device_id:
      required: false
      selector:
        text:
    tray_compartment_index:
      required: false
      selector:
        number:
          min: 1
          max: 4
    feed_duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    heat_before_feeding:
      required: false
      selector:
        boolean:

add_schedule:

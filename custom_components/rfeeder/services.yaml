    device_id:
      required: false
      selector:
        text:
    time:
      required: false
      selector:
        time:
    hour:
      required: false
      selector:
        number:
          min: 0
          max: 23
    minute:
      required: false
      selector:
        number:
          min: 0
          max: 59
    weekdays:
      required: false
      selector:
        object:
